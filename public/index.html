<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baby Milk Tracker - น้องมาตาลิณย์</title>
  <!-- Google Font: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Prompt', sans-serif;
    }
    body {
      background-color: #f3f4f6;
      color: #1f2937;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }
    .app-container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .header p {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 4px;
    }
    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #64748b;
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.95rem;
      color: #1e293b;
      background-color: #f8fafc;
      outline: none;
      transition: all 0.2s;
    }
    .form-control:focus {
      border-color: #38bdf8;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
    }
    .btn-primary:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .btn-line {
      background-color: #06C755;
      color: #ffffff;
      padding: 8px 12px;
      font-size: 0.8rem;
      border-radius: 8px;
      width: auto;
      white-space: nowrap;
    }
    .btn-line:hover {
      background-color: #05b34c;
    }
    .flex-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .summary-box {
      text-align: center;
      padding: 20px 10px;
      color: #94a3b8;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <div class="header">
      <h1>🍼 Baby Milk Tracker - น้องมาตาลิณย์ </h1>
      <p>ระบบบันทึกและติดตามการทานนมรายวัน</p>
    </div>

    <!-- บันทึกรายการใหม่ -->
    <div class="card">
      <div class="card-title">
        <i class="fa-solid fa-pen-to-square" style="color: #0284c7;"></i>
        บันทึกการทานนม
      </div>
      <form id="milkForm">
        <div class="form-group">
          <label>วัน-เวลา</label>
          <input type="datetime-local" id="datetime" required class="form-control">
        </div>

        <div class="form-group">
          <label>ปริมาณ (ออนซ์)</label>
          <input type="number" step="0.5" id="amount" required class="form-control" placeholder="เช่น 3 หรือ 3.5">
        </div>

        <div class="form-group">
          <label>ประเภทนม</label>
          <select id="source" class="form-control">
            <option value="breast">นมแม่ (เข้าเต้า)</option>
            <option value="stock">นมแม่ (สต็อก)</option>
            <option value="formula">นมผง</option>
          </select>
        </div>

        <button type="submit" id="saveBtn" class="btn btn-primary">
          <i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูล
        </button>
      </form>
    </div>

    <!-- สรุปผลรายวัน -->
    <div class="card">
      <div class="flex-between" style="margin-bottom: 12px;">
        <div class="card-title" style="margin-bottom: 0;">
          <i class="fa-solid fa-chart-pie" style="color: #06C755;"></i>
          สรุปผล
        </div>
        <div class="flex-between">
          <input type="date" id="filterDate" class="form-control" style="padding: 6px 10px; font-size: 0.8rem;">
          <button type="button" id="sendLineBtn" onclick="sendSummaryToLine()" class="btn btn-line">
            <i class="fa-brands fa-line" style="font-size: 1rem;"></i> ส่งเข้า LINE
          </button>
        </div>
      </div>

      <div id="summaryContent" class="summary-box">
        เลือกวันที่ด้านบนเพื่อเลือกดูและส่งสรุปผล
      </div>
    </div>
  </div>

  <script>
    // กำหนดเวลาปัจจุบัน
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById('datetime').value = now.toISOString().slice(0, 16);
    document.getElementById('filterDate').value = now.toISOString().slice(0, 10);

    // ส่งบันทึกข้อมูล
    document.getElementById('milkForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังบันทึก...';

      const formData = {
        datetime: document.getElementById('datetime').value,
        amount: parseFloat(document.getElementById('amount').value),
        source: document.getElementById('source').value
      };

      try {
        const response = await fetch('/api/records', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        if (response.ok) {
          alert('บันทึกเรียบร้อยแล้ว!');
          document.getElementById('amount').value = '';
        } else {
          alert('เกิดข้อผิดพลาดในการบันทึก');
        }
      } catch (err) {
        console.error(err);
        alert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> บันทึกข้อมูล';
      }
    });

    // ส่งสรุปเข้า LINE
    async function sendSummaryToLine() {
      const sendBtn = document.getElementById('sendLineBtn');
      const selectedDate = document.getElementById('filterDate').value;

      if (!selectedDate) {
        alert('กรุณาเลือกวันที่ก่อนกดส่งสรุป');
        return;
      }

      const originalText = sendBtn.innerHTML;
      sendBtn.disabled = true;
      sendBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังส่ง...';

      try {
        const response = await fetch('/api/send-line-summary', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date: selectedDate })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          alert('ส่งสรุปผลเข้า LINE เรียบร้อยแล้ว!');
        } else {
          alert('เกิดข้อผิดพลาด: ' + (result.error || 'ไม่สามารถส่งข้อความได้'));
        }
      } catch (err) {
        console.error('Error sending LINE summary:', err);
        alert('ไม่สามารถเชื่อมต่อระบบส่ง LINE ได้');
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerHTML = originalText;
      }
    }
  </script>
</body>
</html>
