<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baby Milk Tracker - น้องมาตาลิณย์</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
</head>
<body class="bg-slate-50 min-h-screen pb-10">
  <div class="max-w-md mx-auto p-4">
    <header class="text-center my-6">
      <h1 class="text-2xl font-bold text-slate-800">🍼 บันทึกการกินนมน้องมาตาลิณย์</h1>
      <p class="text-xs text-slate-500 mt-1">บันทึกและสรุปผลการทานนมรายวัน</p>
    </header>

    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 mb-6">
      <h2 class="text-sm font-bold text-slate-700 mb-3">บันทึกรายการใหม่</h2>
      <form id="milkForm" class="space-y-3">
        <div>
          <label class="block text-xs text-slate-500 mb-1">วัน-เวลา</label>
          <input type="datetime-local" id="datetime" required class="w-full p-2 border border-slate-200 rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">ปริมาณ (ออนซ์)</label>
          <input type="number" step="0.5" id="amount" required class="w-full p-2 border border-slate-200 rounded-lg text-sm" placeholder="เช่น 3 หรือ 3.5">
        </div>
        <div>
          <label class="block text-xs text-slate-500 mb-1">ประเภทนม</label>
          <select id="source" class="w-full p-2 border border-slate-200 rounded-lg text-sm bg-white">
            <option value="breast">นมแม่ (เข้าเต้า)</option>
            <option value="stock">นมแม่ (สต็อก)</option>
            <option value="formula">นมผง</option>
          </select>
        </div>
        <button type="submit" id="saveBtn" class="w-full py-2.5 bg-sky-500 hover:bg-sky-600 text-white font-bold rounded-xl text-sm transition">
          บันทึกการทานนม
        </button>
      </form>
    </div>

    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
      <div class="flex justify-between items-center mb-4 gap-2">
        <h2 class="text-sm font-bold text-slate-700">สรุปผลรายวัน</h2>
        <div class="flex items-center gap-2">
          <input type="date" id="filterDate" class="p-1.5 border border-slate-200 rounded-lg text-xs">
          <button type="button" id="sendLineBtn" onclick="sendSummaryToLine()" class="px-3 py-1.5 bg-[#06C755] hover:bg-[#05b34c] text-white font-bold rounded-lg text-xs flex items-center shadow-sm transition">
            <i class="fa-brands fa-line text-sm mr-1.5"></i> ส่งสรุปเข้า LINE
          </button>
        </div>
      </div>
      <div id="summaryContent" class="text-xs text-slate-500 text-center py-4">
        เลือกวันที่เพื่อดูสรุปผล
      </div>
    </div>
  </div>

  <script>
    const now = new Date();
    now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    document.getElementById('datetime').value = now.toISOString().slice(0, 16);
    document.getElementById('filterDate').value = now.toISOString().slice(0, 10);

    document.getElementById('milkForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.disabled = true;
      saveBtn.innerText = 'กำลังบันทึก...';

      const formData = {
        datetime: document.getElementById('datetime').value,
        amount: parseFloat(document.getElementById('amount').value),
        source: document.getElementById('source').value
      };

      try {
        const response = await fetch('/api/records', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });

        if (response.ok) {
          alert('บันทึกเรียบร้อยแล้ว');
          document.getElementById('amount').value = '';
        } else {
          alert('เกิดข้อผิดพลาดในการบันทึก');
        }
      } catch (err) {
        console.error(err);
        alert('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้');
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = 'บันทึกการทานนม';
      }
    });

    async function sendSummaryToLine() {
      const sendBtn = document.getElementById('sendLineBtn');
      const selectedDate = document.getElementById('filterDate').value;

      if (!selectedDate) {
        alert('กรุณาเลือกวันที่ก่อนกดส่งสรุป');
        return;
      }

      const originalText = sendBtn.innerHTML;
      sendBtn.disabled = true;
      sendBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> กำลังส่ง...';

      try {
        const response = await fetch('/api/send-line-summary', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date: selectedDate })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          alert('ส่งสรุปผลเข้า LINE เรียบร้อยแล้ว!');
        } else {
          alert('เกิดข้อผิดพลาด: ' + (result.error || 'ไม่สามารถส่งข้อความได้'));
        }
      } catch (err) {
        console.error('Error sending LINE summary:', err);
        alert('ไม่สามารถเชื่อมต่อระบบส่ง LINE ได้');
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = originalText;
      }
    }
  </script>
</body>
</html>
